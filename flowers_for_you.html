<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas para Ti</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #fce4ec;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Pantalla inicial con el sobre */
    #envelope-screen {
      text-align: center;
      cursor: pointer;
      transition: transform 0.3s;
    }

    #envelope-screen:hover {
      transform: scale(1.05);
    }

    .envelope {
      width: 280px;
      height: 180px;
      background: #f8bbd0;
      border-radius: 10px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px solid #f48fb1;
    }

    .envelope-title {
      background: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 1.1rem;
      color: #ad1457;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Contenedor principal de la tarjeta */
    #card-screen {
      display: none;
      width: 90%;
      max-width: 500px;
      background: #fffbf0;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
      position: relative;
    }

    .card-content {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Texto con efecto máquina de escribir */
    #typewriter {
      font-size: 1rem;
      color: #4a4a4a;
      line-height: 1.5;
      text-align: center;
      min-height: 90px;
      margin-bottom: 10px;
      font-weight: 500;
    }

    /* Área del árbol */
    #canvas-container {
      width: 100%;
      height: 320px;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
    }

    /* Contador de tiempo */
    #counter-container {
      margin-top: 15px;
      text-align: center;
      border-top: 1px dashed #e0e0e0;
      padding-top: 15px;
      width: 100%;
    }

    .counter-label {
      font-size: 0.85rem;
      color: #757575;
      margin-bottom: 5px;
    }

    .counter-timer {
      font-size: 1.1rem;
      font-weight: bold;
      color: #d81b60;
    }
  </style>
</head>
<body>

  <!-- PANTALLA DEL SOBRE -->
  <div id="envelope-screen" onclick="openCard()">
    <div class="envelope">
      <div class="envelope-title">
        <span>🌻</span> Flores Para Ti <span>📄</span>
      </div>
    </div>
  </div>

  <!-- PANTALLA DE LA TARJETA ANIMADA -->
  <div id="card-screen">
    <div class="card-content">
      <div id="typewriter"></div>
      
      <div id="canvas-container">
        <canvas id="treeCanvas"></canvas>
      </div>

      <div id="counter-container">
        <div class="counter-label">Mi amor por ti comenzó hace...</div>
        <div class="counter-timer" id="timer">Cargando contador...</div>
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // CONFIGURACIÓN PERSONALIZADA
    // Cambia aquí la fecha de inicio (Año, Mes [0=Ene, 11=Dic], Día, Hora, Min)
    const startDate = new Date(2025, 8, 21, 0, 0, 0); 

    const messageLines = [
      "Flores Amarillas para el amor de mi vida:",
      "Si pudiera elegir un lugar seguro, sería a tu lado.",
      "Cuanto más tiempo estoy contigo más te amo.",
      "— I Love You! ❤️"
    ];
    // -------------------------------------------------------------

    function openCard() {
      document.getElementById('envelope-screen').style.display = 'none';
      document.getElementById('card-screen').style.display = 'block';
      startTypewriter();
      initTreeAnimation();
      startCounter();
    }

    // Efecto de escribir texto paso a paso
    let lineIdx = 0;
    let charIdx = 0;
    function startTypewriter() {
      const container = document.getElementById('typewriter');
      if (lineIdx < messageLines.length) {
        if (charIdx < messageLines[lineIdx].length) {
          container.innerHTML += messageLines[lineIdx].charAt(charIdx);
          charIdx++;
          setTimeout(startTypewriter, 40);
        } else {
          container.innerHTML += "<br>";
          lineIdx++;
          charIdx = 0;
          setTimeout(startTypewriter, 300);
        }
      }
    }

    // Contador de tiempo transcurrido
    function startCounter() {
      function updateTimer() {
        const now = new Date();
        const diff = now - startDate;

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / 1000 / 60) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        document.getElementById('timer').innerText = 
          `${days} días ${hours.toString().padStart(2, '0')} horas ${minutes.toString().padStart(2, '0')} minutos ${seconds.toString().padStart(2, '0')} segundos`;
      }
      updateTimer();
      setInterval(updateTimer, 1000);
    }

    // Animación en Canvas (Tronco y Flores en Corazón)
    function initTreeAnimation() {
      const canvas = document.getElementById('treeCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;

      const centerX = canvas.width / 2;
      const startY = canvas.height;
      
      let progress = 0;

      // Coordenadas para la copa en forma de corazón
      function heartShape(t) {
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
        return { x: centerX + x * 7, y: canvas.height / 2.3 + y * 7 };
      }

      // Dibujar flor amarilla
      function drawFlower(x, y, size) {
        ctx.fillStyle = "#fbc02d";
        for (let i = 0; i < 6; i++) {
          ctx.beginPath();
          ctx.arc(x + Math.cos(i * Math.PI / 3) * size, y + Math.sin(i * Math.PI / 3) * size, size / 1.5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = "#5d4037";
        ctx.beginPath();
        ctx.arc(x, y, size / 1.2, 0, Math.PI * 2);
        ctx.fill();
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Tronco
        ctx.strokeStyle = "#5d4037";
        ctx.lineWidth = 12;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(centerX, startY);
        ctx.quadraticCurveTo(centerX - 10, startY - 80, centerX, canvas.height / 2);
        ctx.stroke();

        // Crecimiento de flores formando el corazón
        if (progress < 1) {
          progress += 0.008;
        }

        const maxPetals = 180;
        const currentPetals = Math.floor(maxPetals * progress);

        for (let i = 0; i < currentPetals; i++) {
          const t = (i / maxPetals) * Math.PI * 2;
          const pos = heartShape(t);
          // Variación leve para rellenar
          const offsetX = (Math.sin(i * 99) * 12);
          const offsetY = (Math.cos(i * 99) * 12);
          drawFlower(pos.x + offsetX, pos.y + offsetY, 4);
        }

        requestAnimationFrame(animate);
      }

      animate();
    }
  </script>
</body>
</html>
